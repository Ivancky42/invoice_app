name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://user:password@localhost:5432/db"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - name: Refuse destructive shadow SQL in migrations
        run: |
          if rg -n 'DELETE FROM "(FitnessSnapshot|Counterfactual|ShadowOrder|ShadowPosition|ShadowBranch)"|TRUNCATE TABLE "(FitnessSnapshot|Counterfactual|ShadowOrder|ShadowPosition|ShadowBranch)"' prisma/migrations; then
            echo "::error::Migrations must not wipe shadow/fitness tables — use an offline guarded script instead."
            exit 1
          fi

      - run: pnpm test
