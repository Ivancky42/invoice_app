name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://user:password@localhost:5432/db"
    steps:
      - uses: actions/checkout@v7

      # Node first: pnpm 11 needs Node >= 22.13 to run.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      # pnpm version comes from package.json#packageManager.
      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - name: Refuse destructive shadow SQL in migrations
        run: |
          if grep -rEn 'DELETE FROM "(FitnessSnapshot|Counterfactual|ShadowOrder|ShadowPosition|ShadowBranch)"|TRUNCATE TABLE "(FitnessSnapshot|Counterfactual|ShadowOrder|ShadowPosition|ShadowBranch)"' prisma/migrations; then
            echo "::error::Migrations must not wipe shadow/fitness tables — use an offline guarded script instead."
            exit 1
          fi

      - run: pnpm test
