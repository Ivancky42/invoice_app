services:
  postgres:
    image: postgres:17-alpine
    container_name: invoice_app_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: invoice
      POSTGRES_PASSWORD: invoice
      POSTGRES_DB: invoice_app
    ports:
      - "5433:5432"
    volumes:
      - invoice_pgdata:/var/lib/postgresql/data

volumes:
  invoice_pgdata:
